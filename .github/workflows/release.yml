name: Release

# Builds the packaged app(s) and publishes a GitHub Release whenever a
# version tag (v*) is pushed. Also runnable by hand via workflow_dispatch
# to sanity-check a build without cutting a real release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      # Derives the app version from the triggering tag (v1.2.3 -> 1.2.3) so
      # the macOS and Windows builds bake in a matching, tag-accurate
      # version instead of each hardcoding their own. workflow_dispatch runs
      # have no tag, so they fall back to a clearly-marked dev version.
      - name: Determine version from tag
        id: get_version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (.dmg)
    needs: version
    runs-on: macos-latest
    permissions:
      contents: write # needed to create the release and upload the dmg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # packaging/build-macos.sh (`source .venv/bin/activate`) expects the
      # venv to already exist — recreate it exactly as README.md's
      # "Setup (development)" section documents.
      #
      # opencv-python ships no prebuilt wheel for some platforms (notably
      # Windows ARM64 — see the windows-arm64 job), so its own build always
      # has to compile from source there. Its PEP 517 backend then pins a
      # very old numpy version as ITS OWN build-time dependency, and that
      # old numpy has no wheel for such platforms either, forcing a source
      # build of numpy 1.22.2 too — which fails to compile on the toolchain
      # available on those runners ("Did not find correct pointer sized
      # integer" in arraytypes.c.src). Installing numpy (and opencv-python's
      # other build deps) as normal wheels *first*, then installing
      # opencv-python with --no-build-isolation, makes it build against the
      # already-installed modern numpy instead of pinning/fetching its own —
      # avoiding that old-numpy source build entirely. Applied uniformly
      # here (not just on the affected platform) so all three jobs install
      # opencv-python the same way; it's a no-op wherever a prebuilt wheel
      # exists.
      - name: Create Python virtualenv
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install wheel cmake scikit-build setuptools packaging numpy scipy natsort fastapi uvicorn pydantic pywebview pyinstaller
          pip install --no-build-isolation opencv-python

      # The two external tools packaging/bundle_ffmpeg_macos.sh requires
      # (it errors out by name if either is missing). Both are available
      # via Homebrew, which is preinstalled on GitHub's macOS runners.
      - name: Install ffmpeg + dylibbundler
        run: brew install ffmpeg dylibbundler

      # Does the frontend build, ffmpeg bundling, icon generation,
      # PyInstaller build, and dmg creation in one shot — see the script
      # for details. Produces packaging/dist/Optical2Digital.dmg.
      # APP_VERSION flows into packaging/optical2digital.spec, which bakes
      # it into the .app's Info.plist and the running app's window title.
      - name: Build app + dmg
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: ./packaging/build-macos.sh

      # Only publish on an actual tag push — workflow_dispatch runs (used
      # to test the build itself) have no tag to attach a release to.
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/Optical2Digital.dmg
          generate_release_notes: true

  build-windows-x64:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release and upload artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Mirrors the build-macos job's venv step (see its comment for why
      # opencv-python is installed last with --no-build-isolation), plus
      # pillow (build-time-only, used by packaging/make_icon_windows.py to
      # generate icon.ico).
      - name: Create Python virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install wheel cmake scikit-build setuptools packaging numpy scipy natsort fastapi uvicorn pydantic pywebview pyinstaller pillow
          pip install --no-build-isolation opencv-python

      # windows-latest ships Chocolatey preinstalled; iscc (the Inno Setup
      # compiler) is what packaging/build-windows.ps1 shells out to.
      - name: Install Inno Setup
        run: choco install innosetup -y

      # Does the frontend build, ffmpeg bundling, icon generation,
      # PyInstaller build, zip, and installer creation in one shot — see
      # the script for details. Produces packaging/dist/Optical2Digital-win-x64.zip
      # and packaging/dist/Optical2Digital-Setup-x64.exe.
      - name: Build app, zip, and installer
        shell: pwsh
        run: .\packaging\build-windows.ps1 -Arch x64 -Version "${{ needs.version.outputs.version }}"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/Optical2Digital-win-x64.zip
            packaging/dist/Optical2Digital-Setup-x64.exe
          generate_release_notes: true

  build-windows-arm64:
    name: Build Windows (arm64)
    needs: version
    # GitHub-hosted arm64 Windows runner. VERIFY at implementation/rollout
    # time: availability, quota, and enrollment requirements for this runner
    # label may differ from windows-latest and are worth reconfirming before
    # relying on this for a real release.
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Mirrors the build-macos job's venv step (see its comment for why
      # opencv-python is installed last with --no-build-isolation — this is
      # the platform where that actually matters: opencv-python has no
      # win_arm64 wheel at all, so without this its build pulls in its own
      # old pinned numpy, which also has no win_arm64 wheel and fails to
      # compile from source on this runner's toolchain), plus pillow
      # (build-time-only, used by packaging/make_icon_windows.py to
      # generate icon.ico).
      - name: Create Python virtualenv
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install wheel cmake scikit-build setuptools packaging numpy scipy natsort fastapi uvicorn pydantic pywebview pyinstaller pillow
          pip install --no-build-isolation opencv-python

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build app, zip, and installer
        shell: pwsh
        run: .\packaging\build-windows.ps1 -Arch arm64 -Version "${{ needs.version.outputs.version }}"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/Optical2Digital-win-arm64.zip
            packaging/dist/Optical2Digital-Setup-arm64.exe
          generate_release_notes: true

  build-linux:
    name: Build Linux [placeholder]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: TODO
        run: |
          echo "TODO: implement Linux build (see build-macos job for the pattern)"
